# TranslateGemma Studio — "Native" theme (Streamlit 1.63.0): a Mac utility look.
# System fonts, macOS window/text-field neutrals, apple.com blue as the CTA.
# Both [theme.light] and [theme.dark] are defined so each mode is designed:
# with one missing, that mode falls back to the stock palette under these
# shared keys. (Either section alone already keeps the in-app switcher.)

[theme]
# system-ui resolves to SF on macOS; Streamlit appends "Source Sans", sans-serif.
font = "-apple-system, system-ui"
# h1 at 2rem: the 2.75rem default dwarfs a utility. A shorter array pins only
# the levels it names and leaves the rest at stock, so ["2rem"] alone left h2
# at 2.25rem — larger than h1. All six are pinned, decreasing, though only h1
# (st.title) is used. headingFontWeights is padded to six server-side.
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [600]
baseRadius = "0.375rem"      # macOS control radius: 6px at the 16px root, in rem as the option recommends
showWidgetBorder = true      # text areas and selectboxes are border-defined, like NSTextField

[theme.light]
primaryColor = "#0066CC"             # apple.com link blue; white label 5.57:1
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7" # Apple light gray: the text-field wells
textColor = "#000000"                # pure label; the st.text output ink on the page, 21:1
borderColor = "#86868B"              # apple.com gray; >= 3:1 on both page and well
redColor = "#D70015"                 # HIG increase-contrast red; #FF3B30 fails 4.5:1 once the text is derived
redTextColor = "#6E000B"             # darker than derived #8A000E: widens the red/yellow gap under deuteranopia
yellowColor = "#C99A00"              # systemYellow pulled down so the warning text clears 4.5:1
yellowTextColor = "#7A5E00"          # pinned at the derived value so a derivation change cannot move it

[theme.dark]
primaryColor = "#0071E3"             # apple.com button blue; white label 4.70:1 (Apple's systemBlue #0A84FF only reaches 3.65)
backgroundColor = "#1C1C1E"          # systemGray6: the window
secondaryBackgroundColor = "#141416" # wells darker than the window, like a dark-mode NSTextField
textColor = "#FFFFFF"                # pure label; the st.text output ink on the window, 17:1
borderColor = "#6E6E73"              # apple.com gray; >= 3:1 on both window and well
redColor = "#FF453A"                 # systemRed
redTextColor = "#FFA39E"             # lighter than derived #FF8B85: 7:1 on the error tint
yellowColor = "#FFD60A"              # systemYellow
yellowTextColor = "#FFE357"          # pinned at the derived value so a derivation change cannot move it
