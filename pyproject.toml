[project]
name = "translategemma-studio"
version = "0.15.0"
description = "Streamlit application for translation using Google TranslateGemma on Apple Silicon with MLX."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Lower bounds record the oldest version the app is known to work against;
# uv.lock still pins the exact resolution. See CLAUDE.md for what each floor buys.
dependencies = [
    "streamlit>=1.58",
    # 0.31.3 is a hard floor: earlier 0.31.x hit "no Stream(gpu, 0) in current
    # thread" in wired_limit() when generating off Streamlit's ScriptRunner thread.
    "mlx-lm>=0.31.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
    "ty>=0.0.69",
    "watchdog>=6.0.0",
]

[tool.ruff.lint]
# I: import sorting (isort); UP: pyupgrade; B: bugbear; C4: comprehensions;
# RUF: ruff-specific; SIM: simplify
extend-select = ["I", "UP", "B", "C4", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Keep the live-model test out of the default run and CI; a CLI -m wins.
    "-m",
    "not live",
]
markers = [
    "live: hits the real model on disk (slow, needs the 3.9 GB quant); run with -m live",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["streamlit_app", "languages"]
